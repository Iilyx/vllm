# Только vLLM. Веса лежат в ./models/Qwen3.5-4B.
# Картинки включены: флага --language-model-only здесь нет.

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    shm_size: "8gb"
    ports:
      - "8000:8000"
    volumes:
      - ./models/Qwen3.5-4B:/models/Qwen3.5-4B:ro
    command:
      - ${MODEL_PATH:-/models/Qwen3.5-4B}
      - --served-model-name
      - qwen3.5-4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${MAX_NUM_SEQS:-32}
      - --reasoning-parser
      - qwen3
      - --limit-mm-per-prompt
      - '{"image": 4}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
