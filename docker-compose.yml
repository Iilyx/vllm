# Снаружи только nginx :6767.
# LiteLLM проверяет ключ и срок жизни, Postgres их хранит.
# vLLM считает модель и принимает картинки. Веса лежат в ./models/Qwen3.5-4B.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "6767:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - litellm

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://llmproxy:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - --config=/app/config.yaml
      - --host=0.0.0.0
      - --port=4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 5s
      timeout: 5s
      retries: 10

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ipc: host
    shm_size: "8gb"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models/Qwen3.5-4B:/models/Qwen3.5-4B:ro
    command:
      - ${MODEL_PATH:-/models/Qwen3.5-4B}
      - --served-model-name
      - qwen3.5-4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${MAX_NUM_SEQS:-32}
      - --reasoning-parser
      - qwen3
      - --limit-mm-per-prompt
      - '{"image": 4}'
      - --api-key
      - ${VLLM_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
